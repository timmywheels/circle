name = "circle-sync"
main = "src/index.ts"
compatibility_date = "2025-09-01"
workers_dev = true

[[durable_objects.bindings]]
name = "ROOM"
class_name = "SyncRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SyncRoom"]

[[durable_objects.bindings]]
name = "SEALED"
class_name = "SealedRoom"

[[migrations]]
tag = "v2"
new_sqlite_classes = ["SealedRoom"]

[vars]
APPLE_AUDIENCE = "com.timwheeler.circle,com.timwheeler.circle.mobile,host.exp.Exponent"
APPLE_SERVICES_ID = "com.timwheeler.circle.signin"
